version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cad_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cad_password_2024}
      POSTGRES_DB: ${DB_NAME:-cad_database}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cad_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cad-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cad-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-cad_redis_2024}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cad-network

  # pgAdmin (opcional - para administración de BD)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cad-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cad.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - cad-network
    profiles:
      - tools

  # Redis Commander (opcional - para visualizar Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cad-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-cad_redis_2024}
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - cad-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  cad-network:
    driver: bridge
